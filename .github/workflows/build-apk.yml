
name: Build Android update

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      signed: ${{ steps.sign.outputs.signed }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Test and build optimized APK
        shell: bash
        run: |
          set -euo pipefail
          export APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          gradle testDebugUnitTest lintRelease assembleRelease \
            -PunsignedBuild=true \
            --no-daemon

      - name: Sign with the existing app key
        id: sign
        if: github.event_name != 'pull_request'
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail

          KEY_FILE="$RUNNER_TEMP/existing-app-key.jks"
          trap 'rm -f "$KEY_FILE"' EXIT

          if [ -n "$APP_KEYSTORE_BASE64" ]; then
            printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$KEY_FILE"
            : "${STORE_PASSWORD:?Missing STORE_PASSWORD}"
            : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
            : "${KEY_ALIAS:?Missing KEY_ALIAS}"

          elif [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEY_FILE"
            export STORE_PASSWORD=android
            export KEY_PASSWORD=android
            export KEY_ALIAS=androiddebugkey

          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'Build passed. No signed update was published: supply the ORIGINAL installed-app signing key.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$APKSIGNER" sign \
            --ks "$KEY_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out ChapterReader-1.2.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            ChapterReader-1.2.apk > certificate.txt

          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            ACTUAL=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certificate.txt | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
            EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')

            test "$ACTUAL" = "$EXPECTED" || {
              echo 'Signing certificate mismatch; refusing to publish.'
              exit 1
            }
          fi

          sha256sum ChapterReader-1.2.apk > SHA256SUMS.txt
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: ChapterReader-1.2-update
          path: |
            ChapterReader-1.2.apk
            SHA256SUMS.txt
            certificate.txt
          if-no-files-found: error

      - name: Upload verification reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
          if-no-files-found: ignore

  release:
    needs: build
    if: >-
      needs.build.outputs.signed == 'true' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: ChapterReader-1.2-update

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: 'قارئ الفصول 1.2'
          body: |
            واجهة أبسط، تحسين حفظ موضع القراءة، وإلغاء إحصائيات الكلمات والوقت.
            ثبّت التحديث فوق النسخة الحالية.
            لا تحذف التطبيق إذا رفض أندرويد التثبيت بسبب اختلاف التوقيع.
          files: |
            ChapterReader-1.2.apk
            SHA256SUMS.txt
            certificate.txt
