
name: Build Chapter Reader APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          export APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))

          gradle assembleRelease \
            -PunsignedBuild=true \
            --no-daemon

      - name: Generate temporary signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/chapter-reader.jks" \
            -storepass android123 \
            -keypass android123 \
            -alias chapterreader \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -dname "CN=ChapterReader"

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/chapter-reader.jks" \
            --ks-key-alias chapterreader \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out ChapterReader.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            ChapterReader.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChapterReader-APK
          path: ChapterReader.apk
          if-no-files-found: error
          retention-days: 30
