name: Build Chapter Reader APK

on:
  push:
    branches: [main, master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Test and build
        run: |
          set -euo pipefail
          export APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          gradle testDebugUnitTest lintRelease assembleRelease -PunsignedBuild=true --no-daemon
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-release.html
          if-no-files-found: warn
      - name: Sign with the existing permanent key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APP_KEYSTORE_BASE64" ]; then
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'No permanent signing key is configured. The unsigned build cannot be installed. No temporary key was generated.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          : "${STORE_PASSWORD:?STORE_PASSWORD is required}"
          : "${KEY_ALIAS:?KEY_ALIAS is required}"
          export KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reader.jks"
          trap 'rm -f "$RUNNER_TEMP/reader.jks"' EXIT
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/reader.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out ChapterReader-1.3.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose ChapterReader-1.3.apk
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - name: Upload installable APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ChapterReader-1.3-APK
          path: ChapterReader-1.3.apk
          if-no-files-found: error
      - name: Upload unsigned build for signing
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-build-not-installable
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
